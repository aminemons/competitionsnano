name: Daily competition research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/daily_research.py'
      - '.github/workflows/daily-research.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: competition-atlas-daily
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify sources and discover research leads
        run: python scripts/daily_research.py
      - name: Commit audit and discoveries when files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitions.json data/source-health.json data/research-leads.json data/research-state.json
          if git diff --cached --quiet; then
            echo "No research record change"
          else
            git commit -m "research: daily source and competition discovery audit"
            git push
          fi
